<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1216">
<title>Casualties Unknown - crafting planner</title>
<style>
:root{--bg:#0f1216;--card:#181d24;--card2:#1f252e;--line:#2a323d;--tx:#e6e9ee;--mut:#8d97a5;--acc:#6cc2ff;--ok:#5fd38a;--warn:#f2b84b;--bad:#ff6b6b;--bar:64px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(var(--bar) + 44px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
header{padding:14px 0 6px}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-size:1.25rem;margin:0;flex:1;min-width:0}
h1 small{display:block;font-size:.85rem;font-weight:500;color:var(--acc)}
.tbtn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.tbtn[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
details.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}
details.sum>summary{list-style:none;padding:12px 14px;min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary::after{content:"\25BE";margin-left:auto;color:var(--mut);transition:transform .15s}
details[open].sum>summary::after{transform:rotate(180deg)}
.sumbody{padding:0 14px 14px}
.sumbody h3,.card h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;font-weight:600}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.top{display:flex;align-items:flex-start;gap:10px}
.num{flex:none;min-width:48px;height:48px;padding:0 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.act{flex:1;min-width:0}
.verb{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.what{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.what .x{color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:.8rem;padding:3px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.tag.ok{border-color:#2f6b47;color:var(--ok)}.tag.w{border-color:#6e5521;color:var(--warn)}.tag.b{border-color:#7a3434;color:var(--bad)}.tag.a{border-color:#28597a;color:var(--acc)}
.note{color:var(--mut);font-size:.88rem;margin-top:8px}
.bn{margin-top:12px;border:1px solid #7a3434;background:#2a1719;border-radius:12px;padding:10px 12px}
.bn b{color:var(--bad)}.bn p{margin:4px 0 0;font-size:.88rem;color:#e7c8c8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:.88rem;max-width:100%}
.chip .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--acc);font-weight:600;white-space:nowrap}
.chip.neg b{color:var(--warn)}.chip.pos b{color:var(--ok)}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px}
.ib img{image-rendering:pixelated;image-rendering:crisp-edges}
.ib .q{width:20px;height:20px;border-radius:5px;background:#2b3440;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--mut)}
.ib .drop{width:14px;height:18px;background:var(--acc);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;clip-path:polygon(50% 0,100% 60%,85% 92%,50% 100%,15% 92%,0 60%)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.sbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.sbox .l{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sbox .v{font-weight:700}
.meter{height:6px;border-radius:4px;background:#0c0f13;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--acc)}
.meter.ok i{background:var(--ok)}.meter.w i{background:var(--warn)}.meter.b i{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.tile{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 5px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tile.new{border-color:var(--ok);box-shadow:inset 0 0 0 1px #2f6b47}
.tile .ib{width:40px;height:34px}
.tile .tn{font-size:.72rem;line-height:1.2;text-align:center;color:#c9d0da;word-break:break-word;hyphens:auto;max-width:100%}
.tile .sl{font-size:.64rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.tile .cnt{position:absolute;top:3px;right:5px;font-size:.75rem;font-weight:700;color:var(--acc)}
.conds{display:flex;gap:2px;width:100%;padding:0 2px}
.cb{flex:1;height:5px;border-radius:3px;background:#0c0f13;overflow:hidden}
.cb i{display:block;height:100%}
.pct{font-size:.66rem;color:var(--mut)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bag{background:#141920;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}
.bagh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bagh .bn2{font-weight:600;flex:1;min-width:0}
.bagh .bn2 small{display:block;font-weight:400;color:var(--mut);font-size:.75rem}
.bagh .f{font-size:.8rem;color:var(--mut);white-space:nowrap;text-align:right}
.empty{color:var(--mut);font-size:.82rem;padding:4px 2px}
.warnbox{border:1px solid #7a3434;background:#2a1719;border-radius:12px;padding:8px;margin-top:8px}
.okbox{border:1px solid #2f6b47;border-radius:12px;padding:8px;margin-top:8px;color:var(--ok)}
.miss{display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:.88rem;min-width:0}
@media (min-width:700px){.misses{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}}
.mbox>summary{cursor:pointer;min-height:36px;display:flex;align-items:center;list-style:none}.mbox>summary::-webkit-details-marker{display:none}.mbox>summary::after{content:"\25BE";margin-left:auto;color:var(--mut)}.mbox[open]>summary::after{transform:rotate(180deg)}
.miss .why{color:#e7c8c8;font-size:.8rem;overflow-wrap:anywhere}
details.sub{margin-top:8px}
details.sub>summary{cursor:pointer;color:var(--mut);font-size:.85rem;min-height:36px;display:flex;align-items:center}
/* list view */
.lh{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px;font-weight:700;color:var(--acc);border-bottom:1px solid var(--line)}
.lr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0}
.lr.cur{border-color:var(--acc)}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:8px 10px;min-height:52px}
.lr>details.sub{margin:0;padding:0 10px}
.lr>details.sub>summary{min-height:28px;padding-bottom:6px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr>details[open].sub{padding-bottom:10px}
.li .num{min-width:40px;height:40px;font-size:.95rem}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt span{font-size:.8rem;color:var(--mut)}
.li .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--bad)}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,18,22,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto}
.brow{display:flex;gap:8px;align-items:stretch}
.nav{flex:none;width:30%;max-width:150px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:1rem}
.nav:disabled{opacity:.35}
.ctr{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--acc);background:#14263a;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-width:0}
.ctr b{font-size:1.05rem}.ctr span{font-size:.75rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px}
input[type=range]{width:100%;margin:4px 0 6px;height:32px;accent-color:var(--acc)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:none}
.sheet.open{display:block}
.sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet .pn>.in{max-width:760px;margin:0 auto}
.sheet h3{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.jrow{display:flex;gap:8px}
.jrow input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#0c0f13;padding:0 12px;font-size:1.05rem}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600}
.btn.p{border-color:var(--acc);color:var(--acc)}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.lg button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);line-height:1.15}
.lg button span{display:block;font-size:.72rem;color:var(--mut)}
.lg button.cur{border-color:var(--acc)}
.bl button{display:block;width:100%;text-align:left;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:8px 12px;margin:0 0 6px;font-size:.88rem}
.bl button b{color:var(--bad)}
.shh{display:flex;align-items:center;justify-content:space-between}.shh h3{margin:0}
.kbd{color:var(--mut);font-size:.78rem;margin-top:12px}
@media (min-width:700px){body{font-size:16px}.stat{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}

.sec p.hint{color:var(--mut);font-size:.82rem;margin:6px 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mut);min-width:0}
.fld input,.fld select,.inp{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0c0f13;color:var(--tx);padding:0 10px;font-size:1rem;width:100%;min-width:0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:.92rem}
.chk input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.gset{border:0;padding:0;margin:0;min-width:0}
.gset:disabled{opacity:.45}
.trow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);min-width:0}
.trow:last-child{border-bottom:0}
.trow .tnm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.trow .tnm small{color:var(--mut)}
.trow input.cnt{width:58px;min-height:40px;border-radius:9px;border:1px solid var(--line);background:#0c0f13;color:var(--tx);text-align:center;font-size:.95rem}
.ibtn{flex:none;min-width:40px;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--card2);font-size:.95rem;padding:0 8px}
.ibtn.x{color:var(--bad)}
.brow2{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 6px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:.88rem;min-height:40px}
.cchip button{min-width:32px;min-height:32px;border-radius:8px;border:0;background:transparent;color:var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin-top:10px}
.pgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:6px 4px;font-size:.75rem;line-height:1.15;word-break:break-word}
.pgrid button small{color:var(--mut);font-size:.68rem}
.rawt{width:100%;border-collapse:collapse;font-size:.85rem}
.rawt td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
.rawt td.n{width:100%}
.rawt input[type=text]{width:100px}
.rawt input[type=number]{width:64px}
.rawt input{min-height:40px;border-radius:9px;border:1px solid var(--line);background:#0c0f13;color:var(--tx);padding:0 6px;font-size:.9rem}
.rawt .nm{display:flex;align-items:center;gap:6px;min-width:0}
.rawt .nm span{overflow:hidden;text-overflow:ellipsis}
textarea.json{width:100%;min-height:220px;border-radius:10px;border:1px solid var(--line);background:#0c0f13;color:var(--tx);font:12px/1.4 ui-monospace,monospace;padding:8px}
.info{font-size:.85rem;margin:4px 0;color:#c9d0da}
.info b{color:var(--tx)}
.planbar .btn{flex:1}
@media (max-width:520px){.trow .tnm small{display:none}.trow input.cnt{width:46px}.ibtn{min-width:36px;padding:0 6px}}
@media (min-width:1000px){.wrap{max-width:980px}.bar .in{max-width:980px}.setupcols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}}
</style>
